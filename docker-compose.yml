services:
  api:
    image: python:3.11-slim
    working_dir: /workspace
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg2://quiz:quiz@postgres:5432/quizdb
      - HMAC_CLIENT_ID=agent
      - HMAC_SHARED_SECRET=dev-secret
  worker:
    image: python:3.11-slim
    working_dir: /workspace
    command: sh -c "pip install -r requirements.txt && celery -A workers.celery_app.celery_app worker --loglevel=info"
    volumes:
      - ./:/workspace
    environment:
      - ENV=dev
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg2://quiz:quiz@postgres:5432/quizdb
      - HMAC_CLIENT_ID=agent
      - HMAC_SHARED_SECRET=dev-secret
    depends_on:
      - redis
      - postgres
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quizdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
